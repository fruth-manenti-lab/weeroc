[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radioroc-tools"
version = "0.5.0"
description = "Unofficial desktop and CLI tools for WEEROC RADIOROC 2 SiPM readout"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Fruth-Manenti Lab contributors"}]
dependencies = ["pyserial>=3.5,<4", "filelock>=3.16,<4"]

[project.urls]
Repository = "https://github.com/fruth-manenti-lab/weeroc"
Documentation = "https://github.com/fruth-manenti-lab/weeroc/blob/main/docs/installation_guide.md"
Issues = "https://github.com/fruth-manenti-lab/weeroc/issues"

[project.optional-dependencies]
analysis = ["matplotlib>=3.8,<4"]
gui = ["PySide6>=6.8,<6.12", "matplotlib>=3.8,<4"]
dev = ["build>=1.2,<2"]

[project.scripts]
radioroc = "radioroc.__main__:main"
radioroc-desktop = "radioroc.gui.__main__:main"

# Transitional mappings preserve the existing scripts/imports without copying
# the implementation or default configuration. Extract modules incrementally.
[tool.setuptools]
py-modules = ["radioroc_client", "radioroc_analysis"]
packages = ["radioroc", "radioroc.cli", "radioroc.resources", "radioroc.protocol", "radioroc.transport", "radioroc.application", "radioroc.data", "radioroc.gui"]
include-package-data = false

[tool.setuptools.package-dir]
radioroc = "src/radioroc"
"radioroc.cli" = "scripts"
"radioroc.resources" = "configs"

[tool.setuptools.package-data]
"radioroc.resources" = ["radio_default_i2c.csv", "radioroc_icon.png", "presets/*.json"]
